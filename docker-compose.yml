services:
  postgres:
    image: postgres:16
    container_name: tokentracker-db
    environment:
      POSTGRES_DB: tokentrack
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - tokentrack_pgdata:/var/lib/postgresql/data

volumes:
  tokentrack_pgdata: